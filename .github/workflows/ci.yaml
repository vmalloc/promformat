name: CI
on:
  push:
  pull_request:
  release:
    types: [published]
env:
  CARGO_TERM_COLOR: always
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Install cargo sort
        uses: taiki-e/install-action@v2.81.10
        with:
          tool: cargo-sort@2.1.3
      - name: "Format"
        run: cargo fmt --check
      - name: "Sort"
        run: cargo sort --check
      - name: Clippy
        run: cargo clippy --all --tests -- -D warnings
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # bump this when bumping the MSRV
        rust: ["1.88.0", stable, beta]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: "v0-${{ matrix.rust }}-${{ runner.os }}"
      - name: Run tests (no features)
        run: cargo test --verbose --workspace --doc
      - name: Run tests (chrono)
        run: cargo test --verbose --workspace --doc --features chrono
      - name: Run tests (time)
        run: cargo test --verbose --workspace --doc --features time
      - name: Run tests (jiff)
        run: cargo test --verbose --workspace --doc --features jiff
      - name: Run tests (all features)
        run: cargo test --verbose --workspace --doc --all-features
  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}
      - name: Build
        run: cargo build --verbose
      - name: Publish (dry run)
        run: cargo publish --dry-run
        if: github.event_name != 'release'
      - name: Publish on crates.io
        run: |
          cargo login ${{ secrets.CRATES_IO_TOKEN }}
          cargo publish
        if: github.event_name == 'release'
